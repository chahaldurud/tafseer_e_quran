<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="setting.css">
</head>
<body>
    <header class="settings-header">
        <div class="header-left">
            <img src="icons/setting.svg" alt="Settings" class="header-icon">
            <h1>SETTINGS</h1>
        </div>
        <a href="index.html" class="close-btn">
            <img src="icons/close.svg" alt="Close">
        </a>
    </header>

    <main class="settings-main">
        <div class="settings-container">
            <h2 class="section-title">General</h2>
            
            <div class="setting-card">
                <div class="setting-info">
                    <label>LANGUAGE</label>
                    <p>App language is currently locked.</p>
                </div>
                <div class="setting-value">ENGLISH</div>
            </div>

            <!-- You can add more setting cards here in the future -->
            <div class="setting-card disabled">
                <div class="setting-info">
                    <label>APP VERSION</label>
                    <p>Latest stable release.</p>
                </div>
                <div class="setting-value">v1.0.0</div>
            </div>
        </div>
    </main>
</body>
</html>
